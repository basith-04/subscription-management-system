name: brightloop

# Both images expose a `node` and a `bun` build target.
# Default: Node. Use Bun with:
#   RUNTIME=bun docker compose up --build
services:
  api:
    build:
      context: ./backend
      target: ${RUNTIME:-node}
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "${API_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./frontend
      target: ${RUNTIME:-node}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

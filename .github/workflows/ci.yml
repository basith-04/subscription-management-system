name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm ci
          else
            bun install --frozen-lockfile
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run lint
          else
            bun run lint
          fi

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run typecheck
          else
            bun run typecheck
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm test
          else
            bun run test
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run build
          else
            bun run build
          fi

  frontend:
    name: frontend (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm ci
          else
            bun install --frozen-lockfile
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run lint
          else
            bun run lint
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run build
          else
            bun run build
          fi

  docker:
    name: docker (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target ${{ matrix.runtime }} -t brightloop-api:${{ matrix.runtime }} ./backend

      - name: Build frontend image
        run: docker build --target ${{ matrix.runtime }} -t brightloop-web:${{ matrix.runtime }} ./frontend

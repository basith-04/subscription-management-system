name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brightloop_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/brightloop_test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm ci
          else
            bun install --frozen-lockfile
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run lint
          else
            bun run lint
          fi

      - name: Typecheck
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run typecheck
          else
            bun run typecheck
          fi

      - name: Migrate and seed
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run db:migrate
            npm run db:seed
          else
            bun run db:migrate:bun
            bun run db:seed:bun
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm test
          else
            bun run test
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run build
          else
            bun run build:bun
          fi

  frontend:
    name: frontend (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm ci
          else
            bun install --frozen-lockfile
          fi

      - name: Lint
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run lint
          else
            bun run lint
          fi

      - name: Test
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm test
          else
            bun run test
          fi

      - name: Build
        run: |
          if [ "${{ matrix.runtime }}" = "node" ]; then
            npm run build
          else
            bun run build
          fi

  docker:
    name: docker (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target ${{ matrix.runtime }} -t brightloop-api:${{ matrix.runtime }} ./backend

      - name: Build migration image
        if: matrix.runtime == 'node'
        run: docker build --target migrate -t brightloop-api:migrate ./backend

      - name: Build frontend image
        run: docker build --target ${{ matrix.runtime }} -t brightloop-web:${{ matrix.runtime }} ./frontend
